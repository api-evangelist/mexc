apis:
- aid: mexc:spot-websocket-streams
  name: MEXC Spot WebSocket Streams
  tags:
  - Cryptocurrency
  - Market Data
  - Real-Time
  - Streaming
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: wss://wbs-api.mexc.com/ws
  humanURL: https://mexcdevelop.github.io/apidocs/spot_v3_en/#websocket-market-streams
  properties:
  - url: https://mexcdevelop.github.io/apidocs/spot_v3_en/#websocket-market-streams
    type: Documentation
  description: >-
    The MEXC Spot WebSocket Streams deliver real-time market data and user account updates via persistent
    WebSocket connections. Public channels provide ticker data, order book depth, trade feeds, and kline/candlestick
    streams. Private (authenticated) channels deliver order status updates and account balance changes.
    Each connection supports a maximum of 30 channel subscriptions, with a rate limit of 100 messages
    per second. Connections are valid for up to 24 hours and require periodic ping/pong keepalives.
- aid: mexc:futures-websocket-api
  name: MEXC Futures WebSocket API
  tags:
  - Cryptocurrency
  - Derivatives
  - Futures
  - Real-Time
  - Streaming
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: wss://contract.mexc.com/edge
  humanURL: https://mexcdevelop.github.io/apidocs/contract_v1_en/#websocket-api
  properties:
  - url: https://mexcdevelop.github.io/apidocs/contract_v1_en/#websocket-api
    type: Documentation
  description: >-
    The MEXC Futures WebSocket API streams real-time derivatives market data and account events over persistent
    WebSocket connections. Public channels include ticker data, trade transactions, order book depth,
    k-line streams, and funding rate updates. Private channels (requiring login) stream order status changes,
    position updates, asset balance changes, and ADL level alerts. The API uses the same base domain as
    the Futures REST API and supports both public and authenticated channel subscriptions in a single
    connection.
- aid: mexc:broker-api
  name: MEXC Broker API
  tags:
  - Account Management
  - Brokers
  - Cryptocurrency
  - Enterprise
  - Sub-Account
  tags_raw:
  - Account Management
  - Broker
  - Cryptocurrency
  - Enterprise
  - Sub-Account
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mexc.com
  humanURL: https://mexcdevelop.github.io/apidocs/
  properties:
  - url: https://mexcdevelop.github.io/apidocs/
    type: Documentation
  description: >-
    The MEXC Broker API enables institutional partners to manage sub-accounts and provide trading services
    to their users. MEXC supports three broker modes: API Broker for copy-trading and trading bot platforms,
    Independent Broker for wallet and market-data aggregation platforms, and OAuth Broker for third-party
    applications using OAuth 2.0. Brokers can create and manage sub-accounts, generate deposit addresses,
    process withdrawals, enable futures for sub-accounts, perform universal transfers between spot and
    futures accounts, and track rebate history. Up to 30 sub-accounts can be maintained per master account.
