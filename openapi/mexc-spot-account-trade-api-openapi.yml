openapi: 3.2.0
info:
  title: MEXC Spot REST API v3 Spot Account/Trade API
  description: MEXC Spot REST API (v3) providing programmatic access to spot trading, market data, account management, and wallet operations.
  version: 1.0.0
servers:
- url: https://api.mexc.com
tags:
- name: Spot Account/Trade
paths:
  /api/v3/order/test:
    post:
      tags:
      - Spot Account/Trade
      summary: Test New Order
      operationId: test_new_order
      parameters:
      - name: symbol
        in: query
        description: Symbol
        required: false
        schema:
          type: string
      - name: side
        in: query
        description: ENUM：Order Side
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: ENUM：Order Type
        required: false
        schema:
          type: string
      - name: quantity
        in: query
        description: Quantity
        required: false
        schema:
          type: string
      - name: price
        in: query
        description: Price
        required: false
        schema:
          type: string
      - name: timestamp
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: signature
        in: query
        description: ''
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      security:
      - ApiKeyAuth: []
