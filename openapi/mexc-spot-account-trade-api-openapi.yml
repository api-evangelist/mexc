          type: string
      - name: type
        in: query
        description: 'ENUM：Order Type '
        required: false
        schema:
          type: string
      - name: quantity
        in: query
        description: Quantity
        required: false
        schema:
          type: string
      - name: price
        in: query
        description: Price
        required: false
        schema:
          type: string
      - name: timestamp
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: signature
        in: query
        description: ''
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
