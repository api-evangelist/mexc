openapi: 3.2.0
info:
  title: MEXC Spot REST API v3 EFT API
  description: MEXC Spot REST API (v3) providing programmatic access to spot trading, market data, account management, and wallet operations.
  version: 1.0.0
servers:
- url: https://api.mexc.com
tags:
- name: EFT
paths:
  /api/v3/etf/info:
    get:
      tags:
      - EFT
      summary: ETF info
      operationId: etf_info
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      security:
      - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-MEXC-APIKEY
